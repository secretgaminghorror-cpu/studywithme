<h2>Persone</h2><div class="box"><input id="ie" type="email" placeholder="Email dell’amico"><input id="ip" value="${genPw()}" placeholder="Password"><select id="ir"><option value="user">Utente</option><option value="premium">Premium</option></select><button class="btn" id="inv">Crea accesso</button></div><div style="height:10px"></div>
${cred?`<div class="card"><div class="ct"><b>Credenziali da inviare</b><small>${esc(cred.email)} · ${esc(cred.password)}</small></div><button class="sm" id="cp">Copia</button></div>`:""}
${ppl.map(p=>`<div class="card wr"><div class="ct"><b>${esc(p.email)}</b>${p.role==="premium"?`<small>Scadenza Premium:</small>`:""}</div>${p.role==="premium"?`<input class="sm" type="date" data-pu="${esc(p.email)}" value="${((prof[p.email]||{}).premium_until||"").slice(0,10)}" style="width:140px">`:""}${dvs.has((prof[p.email]||{}).id)?`<button class="sm" data-dv="${prof[p.email].id}">📱 Sblocca</button>`:""}<select class="sm" data-pr="${esc(p.email)}">${opt(0,p.role)}</select><button class="sm" data-pw="${esc(p.email)}">🔑</button>${p.email===me.email?"":`<button class="sm" data-rm="${esc(p.email)}">✕</button>`}</div>`).join("")}`;
  const run=async(f,ok)=>{try{await f();if(ok)toast(ok);await refresh()}catch(x){toast("Errore: "+(x.message||x))}};
  $("#v").onclick=e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset;
    if(b.id==="up")run(async()=>{const f=$("#f").files[0];if(!f)throw"Scegli un PDF";const path=crypto.randomUUID()+".pdf";
      chk(await sb.storage.from("pdfs").upload(path,f,{contentType:"application/pdf"}));
      chk(await sb.from("documents").insert({title:$("#t").value.trim()||f.name.replace(/\.pdf$/i,""),tier:$("#tr").value,subject:$("#sj").value||null,path}))},"Caricato ✓");
    else if(D.tt)run(async()=>{const d=docs.find(x=>x.id===D.tt);chk(await sb.from("documents").update({tier:d.tier==="premium"?"user":"premium"}).eq("id",d.id))});
    else if(D.dl){if(armed!==D.dl){armed=D.dl;return adminView()}const d=docs.find(x=>x.id===D.dl);armed="";
      run(async()=>{await sb.storage.from("pdfs").remove([d.path]);chk(await sb.from("documents").delete().eq("id",d.id))},"Eliminato")}
    else if(b.id==="inv")run(async()=>{const email=$("#ie").value.trim().toLowerCase(),password=$("#ip").value,role=$("#ir").value;
      if(!email)throw"Inserisci un’email";if(password.length<8)throw"Password di almeno 8 caratteri";
      chk(await sb.rpc("admin_create_user",{p_email:email,p_password:password,p_role:role}));cred={email,password}},"Accesso creato ✓");
    else if(D.pw){const p=prompt("Nuova password per "+D.pw+" (min. 8 caratteri):");if(p)run(async()=>{if(p.length<8)throw"Password troppo corta";chk(await sb.rpc("admin_set_password",{p_email:D.pw,p_password:p}));cred={email:D.pw,password:p}},"Password aggiornata ✓")}
    else if(b.id==="cp"){navigator.clipboard.writeText(`Study With Me\n${location.href.split("?")[0]}\nEmail: ${cred.email}\nPassword: ${cred.password}`);toast("Copiato ✓")}
    else if(D.bl)run(async()=>{chk(await sb.from("invites").delete().eq("email",D.bl));await sb.from("profiles").update({role:"blocked"}).eq("email",D.bl);await sb.from("events").update({seen:true}).eq("email",D.bl)},"Account bloccato");
    else if(b.id==="seen")run(async()=>{chk(await sb.from("events").update({seen:true}).eq("seen",false))});
    else if(b.id==="gadd")run(async()=>{const fs=[...$("#gf").files];if(!fs.length)throw"Scegli almeno una foto";
      for(const f of fs){const lab=(fs.length===1&&$("#gl").value.trim())||f.name.replace(/\.[^.]+$/,""),path=crypto.randomUUID()+".jpg";
        chk(await sb.storage.from("giochi").upload(path,await square(f),{contentType:"image/jpeg"}));chk(await sb.from("game_cards").insert({label:lab,image_path:path}))}},"Foto aggiunte ✓");
    else if(D.gd){if(armed!==D.gd){armed=D.gd;return adminView()}const x=gc.find(y=>y.id===D.gd);armed="";run(async()=>{await sb.storage.from("giochi").remove([x.image_path]);chk(await sb.from("game_cards").delete().eq("id",x.id))},"Eliminata")}
    else if(D.dv)run(async()=>{chk(await sb.from("devices").delete().eq("user_id",D.dv))},"Dispositivo sbloccato ✓");
    else if(b.id==="padd")run(async()=>{const t=$("#pt").value.trim();if(!t)throw"Scrivi un titolo";let path=null;const f=$("#pf").files[0];
      if(f){path=crypto.randomUUID()+".jpg";chk(await sb.storage.from("bacheca").upload(path,await shrink(f),{contentType:"image/jpeg"}))}
      chk(await sb.from("posts").insert({title:t,body:$("#pb").value.trim(),tier:$("#pa").value,pinned:$("#pp").checked,image_path:path}))},"Pubblicato ✓");
    else if(D.pd){if(armed!==D.pd){armed=D.pd;return adminView()}const x=posts.find(y=>y.id===D.pd);armed="";run(async()=>{if(x.image_path)await sb.storage.from("bacheca").remove([x.image_path]);chk(await sb.from("posts").delete().eq("id",x.id))},"Eliminato")}
    else if(b.id==="csv")run(async()=>{chk(await sb.from("settings").upsert([{key:"welcome",value:$("#cw").value.trim()},{key:"c1",value:$("#c1").value},{key:"c2",value:$("#c2").value},{key:"xmas",value:$("#cx").checked?"1":"0"}]))},"Aspetto salvato ✓");
    else if(b.id==="sadd")run(async()=>{const name=$("#sn").value.trim();if(!name)throw"Scrivi il nome della materia";chk(await sb.from("subjects").upsert({name,icon:$("#si").value.trim()||"📘",color:$("#sc").value}))},"Materia salvata ✓");
    else if(D.sd)run(async()=>{await sb.from("documents").update({subject:null}).eq("subject",D.sd);chk(await sb.from("subjects").delete().eq("name",D.sd))},"Materia eliminata");
    else if(D.rm)run(async()=>{chk(await sb.from("invites").delete().eq("email",D.rm));await sb.from("profiles").update({role:"blocked"}).eq("email",D.rm)},"Rimosso")};
  $("#v").onchange=e=>{const u=e.target.closest("[data-pu]");if(u)return run(async()=>{chk(await sb.from("profiles").update({premium_until:u.value?new Date(u.value+"T23:59:59").toISOString():null}).eq("email",u.dataset.pu))},"Scadenza salvata");const j=e.target.closest("[data-sj]");if(j)return run(async()=>{chk(await sb.from("documents").update({subject:j.value||null}).eq("id",j.dataset.sj))});const s=e.target.closest("[data-pr]");if(s)run(async()=>{chk(await sb.from("invites").update({role:s.value}).eq("email",s.dataset.pr));await sb.from("profiles").update({role:s.value}).eq("email",s.dataset.pr)},"Aggiornato")}}

/* Lettore protetto: pagine su canvas, nessun download, filigrana con l'email */
function mark(c){const x=c.getContext("2d"),W=c.width,H=c.height;
  x.save();x.globalAlpha=.16;x.fillStyle="#555";x.font=Math.round(W/32)+"px sans-serif";x.rotate(-Math.PI/6);
  const t=me.email+" · "+fd(Date.now());
  for(let y=0;y<W/2+H;y+=W/8)for(let xx=-H/2;xx<W;xx+=W*.62)x.fillText(t,xx,y);x.restore()}
async function draw(pdf,el,W){
  const pg=await pdf.getPage(+el.dataset.n),v=pg.getViewport({scale:1}),dpr=Math.min(devicePixelRatio||1,2),
  vp=pg.getViewport({scale:W/v.width*dpr}),c=document.createElement("canvas");
  c.width=vp.width;c.height=vp.height;c.style.width=W+"px";c.style.height=vp.height/dpr+"px";
  await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;mark(c);el.style.height="auto";el.replaceChildren(c)}
async function openDoc(d,sp){
  const rd=$("#rd"),box=$("#pg");rd.classList.add("on");rd.classList.remove("hide");curD=d;curPdf=null;
  $("#rt").textContent=d.title;curDoc=d.title;logEv("open",d.title);$("#pn").textContent="";$("#bar").style.width="0";
  box.className=["","night","sepia"][rm];$("#tm").textContent=["🌙","📜","☀️"][rm];$("#ns").classList.remove("on");box.innerHTML=`<div class="sk"></div>`;
  try{
    const u=chk(await sb.storage.from("pdfs").createSignedUrl(d.path,60)).data.signedUrl;
    curPdf=await pdfjsLib.getDocument({data:await (await fetch(u)).arrayBuffer()}).promise;
    nts=(await sb.from("notes").select("*").eq("doc_id",d.id).order("page")).data||[];
    await pages(sp||(ud[d.id]||{}).page||1);
  }catch(e){box.innerHTML=`<p class="c" style="color:#fff">Impossibile aprire il PDF.</p>`}}
async function pages(start){
  const box=$("#pg"),pdf=curPdf,N=pdf.numPages,d=curD;
  const W=Math.round(Math.min(box.clientWidth-16,900)*rz),v=(await pdf.getPage(1)).getViewport({scale:1}),h=Math.round(W*v.height/v.width);
  curH=h;curPg=start;if(io)io.disconnect();box.innerHTML="";
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);draw(pdf,en.target,W)}}),{root:box,rootMargin:"900px 0px"});
  for(let n=1;n<=N;n++){const e=document.createElement("div");e.className="pg";e.dataset.n=n;e.style.width=W+"px";e.style.height=h+"px";box.appendChild(e);io.observe(e)}
  const pos=()=>{const n=Math.min(N,Math.floor((box.scrollTop+box.clientHeight/3)/(h+10))+1);
    if(n!==curPg){curPg=n;clearTimeout(svT);svT=setTimeout(()=>saveUd(d.id,{page:n,total:N,done:!!(ud[d.id]||{}).done||n>=N}),1500)}
    $("#pn").textContent=curPg+" / "+N;$("#bar").style.width=curPg/N*100+"%"};
  box.onscroll=pos;box.scrollTop=(start-1)*(h+10);pos()}
const svSet=()=>{try{localStorage.rz=rz;localStorage.rm=rm}catch(e){}};
$("#tm").onclick=()=>{rm=(rm+1)%3;$("#pg").className=["","night","sepia"][rm];$("#tm").textContent=["🌙","📜","☀️"][rm];svSet()};
$("#zi").onclick=()=>{rz=Math.min(2,rz+.25);svSet();if(curPdf)pages(curPg)};
$("#zo").onclick=()=>{rz=Math.max(.5,rz-.25);svSet();if(curPdf)pages(curPg)};
const nsHtml=()=>`<div class="row"><b>🔖 Note</b><button class="sm" id="nx">Chiudi</button></div><div class="row" style="margin:10px 0"><button class="sm" id="np">−</button><b>Pagina <span id="nl">${notePg}</span></b><button class="sm" id="nn">＋</button></div><input id="nti" placeholder="Nota (facoltativa)"><button class="btn" id="nad">＋ Aggiungi alla pagina ${notePg}</button>${nts.map(n=>`<div class="card" style="margin-top:8px;box-shadow:none"><div class="ct" data-gp="${n.page}" style="cursor:pointer"><b>Pagina ${n.page}</b><small>${esc(n.text||"Segnalibro")}</small></div><button class="sm" data-ne="${n.id}">✎</button><button class="sm" data-nd="${n.id}">✕</button></div>`).join("")||`<p class="mu">Ancora nessuna nota.</p>`}`;
const goPg=n=>{$("#pg").scrollTop=(n-1)*(curH+10)};
$("#nt").onclick=()=>{const o=$("#ns");if(!o.classList.contains("on")){notePg=curPg||1;o.innerHTML=nsHtml()}o.classList.toggle("on")};
$("#ns").onclick=async e=>{const t=e.target.closest("button,[data-gp]");if(!t)return;const N=curPdf?curPdf.numPages:1;
  if(t.id==="nx")$("#ns").classList.remove("on");
  else if(t.id==="np"||t.id==="nn"){notePg=Math.min(N,Math.max(1,notePg+(t.id==="nn"?1:-1)));$("#nl").textContent=notePg;$("#nad").textContent="＋ Aggiungi alla pagina "+notePg;goPg(notePg)}
  else if(t.id==="nad"){const r=await sb.from("notes").insert({doc_id:curD.id,page:notePg,text:$("#nti").value.trim()}).select().single();if(!r.error){nts.push(r.data);nts.sort((a,b)=>a.page-b.page);$("#ns").innerHTML=nsHtml();toast("Nota salvata ✓")}else toast("Errore nel salvataggio")}
  else if(t.dataset.ne){const n=nts.find(x=>x.id==t.dataset.ne);lastBlur=Date.now();const v=prompt("Modifica nota",n.text||"");if(v!==null){await sb.from("notes").update({text:v.trim()}).eq("id",n.id);n.text=v.trim();$("#ns").innerHTML=nsHtml()}}
  else if(t.dataset.gp){goPg(+t.dataset.gp);$("#ns").classList.remove("on")}
  else if(t.dataset.nd){await sb.from("notes").delete().eq("id",t.dataset.nd);nts=nts.filter(n=>n.id!=t.dataset.nd);$("#ns").innerHTML=nsHtml()}};
$("#pn").onclick=()=>{if(!curPdf)return;lastBlur=Date.now();const N=curPdf.numPages,v=parseInt(prompt("Vai alla pagina (1-"+N+")"));if(v)goPg(Math.min(N,Math.max(1,v)))};
$("#cl").onclick=()=>{clearTimeout(svT);if(curD&&curPdf){const N=curPdf.numPages;saveUd(curD.id,{page:curPg||1,total:N,done:!!(ud[curD.id]||{}).done||curPg>=N})}
  $("#rd").classList.remove("on");$("#ns").classList.remove("on");$("#pg").innerHTML="";curPdf=null;list();sb.from("notes").select("*").order("created_at",{ascending:false}).then(r=>{allNotes=r.data||[];list()})};
const on=()=>$("#rd").classList.contains("on"),hid=v=>{if(on()&&!$("#ns").classList.contains("on")){$("#rd").classList.toggle("hide",v);if(v&&Date.now()-lastBlur>20000){lastBlur=Date.now();logEv("blur",curDoc)}}};
["contextmenu","dragstart","copy","cut","selectstart"].forEach(t=>document.addEventListener(t,e=>{if(on())e.preventDefault()}));
document.addEventListener("keydown",e=>{if(on()&&(e.ctrlKey||e.metaKey)&&"spcua".includes(e.key.toLowerCase()))e.preventDefault()});
document.addEventListener("keyup",e=>{if(on()&&e.key==="PrintScreen"){lastBlur=Date.now();hid(true);logEv("print",curDoc);try{navigator.clipboard.writeText("")}catch(x){}}});
addEventListener("blur",()=>hid(true));addEventListener("focus",()=>hid(false));
document.addEventListener("visibilitychange",()=>hid(document.hidden));
$("#rd").addEventListener("pointerdown",()=>$("#rd").classList.remove("hide"));

setInterval(()=>{if(me&&me.role==="admin")loadEv()},30000);
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){const c=document.createElement("canvas");c.id="snow";document.body.appendChild(c);const x=c.getContext("2d"),F=[];let W,H;
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
  for(let i=0;i<55;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.8,v:.4+Math.random()*1.1,d:Math.random()*6});
  const f=t=>{requestAnimationFrame(f);x.clearRect(0,0,W,H);if(!X()||document.hidden)return;x.fillStyle="rgba(255,255,255,.95)";x.shadowColor="rgba(90,110,160,.6)";x.shadowBlur=3;
    for(const o of F){o.y+=o.v;o.x+=Math.sin(t/1500+o.d)*.4;if(o.y>H+5){o.y=-5;o.x=Math.random()*W}x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}};f(0)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me&&!on()&&tab==="lib"&&Date.now()-lastRef>180000)refresh()});
$("#md").onclick=e=>{if(e.target.id==="md"||e.target.id==="mx")$("#md").classList.remove("on")};
sb.auth.onAuthStateChange((ev,s)=>{if(s){if(!me||me.uid!==s.user.id)setTimeout(()=>load(s),0)}else login()});
</script></body></html>
